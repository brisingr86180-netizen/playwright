name: Playwright VTC

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Vérifier les fichiers
        run: |
          echo "=== Répertoire ==="
          pwd
          echo "=== Tests ==="
          ls -la tests
          echo "=== Fichier ciblé ==="
          ls -la tests/vtc.spec.js

      - name: Lancer la surveillance VTC
        env:
          VTC_USERNAME: ${{ secrets.VTC_USERNAME }}
          VTC_PASSWORD: ${{ secrets.VTC_PASSWORD }}
        run: npx playwright test tests/vtc.spec.js